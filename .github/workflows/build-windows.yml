name: Build Windows

on:
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: Git ref of obs-auto-stop to build
        required: true
        default: v0.1.0-pre-region
      attach_release:
        description: Release tag to attach the zip to (empty to skip)
        required: false
        default: v0.1.0-pre-region
      obs_ref:
        description: obs-studio ref
        required: false
        default: 32.0.2
      deps_date:
        description: obs-deps date tag
        required: false
        default: 2025-08-23

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.plugin_ref }}
          path: plugin

      - name: Checkout obs-studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ github.event.inputs.obs_ref }}
          submodules: recursive
          path: obs-studio

      - name: Download obs-deps + Qt6
        shell: pwsh
        run: |
          $date = '${{ github.event.inputs.deps_date }}'
          $base = "https://github.com/obsproject/obs-deps/releases/download/$date"
          New-Item -ItemType Directory -Force -Path obs-deps | Out-Null
          Invoke-WebRequest "$base/windows-deps-$date-x64.zip" -OutFile deps.zip
          Invoke-WebRequest "$base/windows-deps-qt6-$date-x64.zip" -OutFile qt6.zip
          Expand-Archive deps.zip -DestinationPath obs-deps -Force
          Expand-Archive qt6.zip -DestinationPath obs-deps -Force
          Get-ChildItem obs-deps | Select-Object Name

      - name: Configure obs-studio (libobs + frontend-api)
        shell: pwsh
        run: |
          cmake -S obs-studio -B obs-build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/obs-deps" `
            -DENABLE_UI=ON `
            -DENABLE_FRONTEND=ON `
            -DENABLE_PLUGINS=OFF `
            -DENABLE_BROWSER=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_WEBSOCKET=OFF `
            -DENABLE_AJA=OFF `
            -DENABLE_VLC=OFF `
            -DENABLE_QSV11=OFF `
            -DENABLE_WEBRTC=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build obs-frontend-api
        shell: pwsh
        run: |
          cmake --build obs-build --target obs-frontend-api --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage OBS dev layout for plugin CMake
        shell: pwsh
        run: |
          $root = ((Resolve-Path .).Path -replace '\\', '/')
          $dev = "$root/obs-dev"
          New-Item -ItemType Directory -Force -Path "$dev/lib" | Out-Null

          $obsLib = Get-ChildItem -Recurse obs-build -Filter 'obs.lib' | Select-Object -First 1
          if (-not $obsLib) { throw 'obs.lib not found' }
          Copy-Item $obsLib.FullName "$dev/lib/obs.lib" -Force

          $feLib = Get-ChildItem -Recurse obs-build -Filter 'obs-frontend-api.lib' | Select-Object -First 1
          if (-not $feLib) { throw 'obs-frontend-api.lib not found' }
          Copy-Item $feLib.FullName "$dev/lib/obs-frontend-api.lib" -Force

          $studio = "$root/obs-studio"
          $build = "$root/obs-build"
          # Plugin/libobs expect generated obsconfig.h from the OBS build tree
          $genInc = "$build/config"
          if (-not (Test-Path "$genInc/obsconfig.h") -and -not (Test-Path "$genInc/obs-config.h")) {
            $found = Get-ChildItem -Recurse $build -Filter 'obsconfig.h' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $genInc = $found.DirectoryName -replace '\\', '/' }
            else {
              $found2 = Get-ChildItem -Recurse $build -Filter 'obs-config.h' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found2) { $genInc = $found2.DirectoryName -replace '\\', '/' }
              else { throw 'obsconfig.h / obs-config.h not found in obs-build' }
            }
          }
          $libInc = "$studio/libobs"
          $feInc = "$studio/frontend/api"

          "OBS_DEV=$dev" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OBS_STUDIO=$studio" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OBS_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OBS_LIB_INC=$libInc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OBS_GEN_INC=$genInc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OBS_FE_INC=$feInc" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "libInc=$libInc"
          Write-Output "genInc=$genInc"
          Write-Output "feInc=$feInc"
          Write-Output "feLib=$($feLib.FullName)"

      - name: Configure plugin
        shell: pwsh
        run: |
          $qtRoot = $null
          foreach ($r in (Get-ChildItem obs-deps -Directory)) {
            if (Test-Path (Join-Path $r.FullName 'lib/cmake/Qt6')) {
              $qtRoot = ($r.FullName -replace '\\', '/')
              break
            }
          }
          if (-not $qtRoot -and (Test-Path obs-deps/lib/cmake/Qt6)) {
            $qtRoot = ((Resolve-Path obs-deps).Path -replace '\\', '/')
          }
          if (-not $qtRoot) { throw 'Qt6 cmake package not found' }

          $dev = ($env:OBS_DEV -replace '\\', '/')
          $libInc = ($env:OBS_LIB_INC -replace '\\', '/')
          $genInc = ($env:OBS_GEN_INC -replace '\\', '/')
          $feInc = ($env:OBS_FE_INC -replace '\\', '/')
          $studio = ($env:OBS_STUDIO -replace '\\', '/')
          $build = ($env:OBS_BUILD -replace '\\', '/')

          $cmakePath = Join-Path $pwd 'plugin/CMakeLists.txt'
          $cmake = Get-Content -Raw $cmakePath
          $cmake = $cmake.Replace('find_path(OBS_LIBOBS_INCLUDE_DIR', "set(OBS_LIBOBS_INCLUDE_DIR `"$libInc`" CACHE PATH `"libobs include`" FORCE)`nfind_path(OBS_LIBOBS_INCLUDE_DIR_DISABLED")
          # Safer: rewrite the four find_* blocks with explicit markers via line-based edit
          $lines = Get-Content $cmakePath
          $out = New-Object System.Collections.Generic.List[string]
          $i = 0
          while ($i -lt $lines.Count) {
            $line = $lines[$i]
            if ($line -match 'find_path\(OBS_LIBOBS_INCLUDE_DIR') {
              $out.Add("set(OBS_LIBOBS_INCLUDE_DIR `"$libInc`" CACHE PATH `"libobs include`" FORCE)")
              while ($i -lt $lines.Count -and $lines[$i] -notmatch '\)\s*$') { $i++ }
              $i++
              continue
            }
            if ($line -match 'find_path\(OBS_GENERATED_INCLUDE_DIR') {
              $out.Add("set(OBS_GENERATED_INCLUDE_DIR `"$genInc`" CACHE PATH `"generated include`" FORCE)")
              while ($i -lt $lines.Count -and $lines[$i] -notmatch '\)\s*$') { $i++ }
              $i++
              continue
            }
            if ($line -match 'find_library\(OBS_LIBOBS_LIBRARY') {
              $out.Add("set(OBS_LIBOBS_LIBRARY `"$dev/lib/obs.lib`" CACHE FILEPATH `"libobs`" FORCE)")
              while ($i -lt $lines.Count -and $lines[$i] -notmatch '\)\s*$') { $i++ }
              $i++
              continue
            }
            if ($line -match 'find_library\(OBS_FRONTEND_API_LIBRARY') {
              $out.Add("set(OBS_FRONTEND_API_LIBRARY `"$dev/lib/obs-frontend-api.lib`" CACHE FILEPATH `"frontend-api`" FORCE)")
              while ($i -lt $lines.Count -and $lines[$i] -notmatch '\)\s*$') { $i++ }
              $i++
              continue
            }
            if ($line -match 'target_include_directories\(obs-auto-stop PRIVATE') {
              $out.Add('target_include_directories(obs-auto-stop PRIVATE')
              $out.Add("        `"$libInc`"")
              $out.Add("        `"$genInc`"")
              $out.Add("        `"$feInc`"")
              $out.Add(')')
              while ($i -lt $lines.Count -and $lines[$i] -notmatch '\)\s*$') { $i++ }
              $i++
              continue
            }
            $out.Add($line)
            $i++
          }
          [System.IO.File]::WriteAllLines($cmakePath, $out)

          cmake -S plugin -B plugin-build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DOBS_SOURCE_DIR="$studio" `
            -DOBS_BUILD_DIR="$build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build plugin
        shell: pwsh
        run: |
          cmake --build plugin-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse plugin-build -Filter 'obs-auto-stop.dll' | Format-Table FullName, Length

      - name: Package zip
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse plugin-build -Filter 'obs-auto-stop.dll' | Select-Object -First 1
          if (-not $dll) { throw 'obs-auto-stop.dll not found' }
          $stage = Join-Path $pwd 'stage/obs-auto-stop'
          New-Item -ItemType Directory -Force -Path "$stage/bin/64bit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/data/locale" | Out-Null
          Copy-Item $dll.FullName "$stage/bin/64bit/obs-auto-stop.dll" -Force
          $localeSrc = Join-Path $pwd 'plugin/data/locale'
          if (Test-Path $localeSrc) {
            Copy-Item "$localeSrc/*" "$stage/data/locale/" -Force
          }
          @(
            'OBS Auto Stop — pre-region Windows build',
            "Plugin ref: ${{ github.event.inputs.plugin_ref }}",
            "OBS ref: ${{ github.event.inputs.obs_ref }}",
            'Built for Windows x64 / OBS 32.x',
            '',
            'Install:',
            'Extract so that obs-auto-stop/ is under %APPDATA%\obs-studio\plugins\',
            'Then restart OBS.'
          ) | Set-Content -Encoding utf8 "$stage/README-DIST.txt"
          $zipName = 'obs-auto-stop-v0.1.0-pre-region-windows.zip'
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path (Join-Path $pwd 'stage/obs-auto-stop') -DestinationPath $zipName -Force
          Get-Item $zipName | Format-List FullName, Length
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-auto-stop-windows
          path: ${{ env.ZIP_NAME }}

      - name: Attach to GitHub Release
        if: ${{ github.event.inputs.attach_release != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.inputs.attach_release }}' '${{ env.ZIP_NAME }}' --repo ${{ github.repository }} --clobber
