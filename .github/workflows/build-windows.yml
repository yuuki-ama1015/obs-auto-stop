name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: Git ref of obs-auto-stop to build
        required: true
        default: main
      attach_release:
        description: Release tag to attach the zip to (empty to skip)
        required: false
        default: ''
      obs_ref:
        description: obs-studio ref
        required: false
        default: 32.0.2
      deps_date:
        description: obs-deps date tag
        required: false
        default: 2025-08-23

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.inputs.plugin_ref || github.ref }}
  cancel-in-progress: true

env:
  OBS_REF: ${{ github.event.inputs.obs_ref || '32.0.2' }}
  DEPS_DATE: ${{ github.event.inputs.deps_date || '2025-08-23' }}

jobs:
  linux:
    name: Linux (strict warnings)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.plugin_ref || '' }}

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake g++ libobs-dev qt6-base-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DOBS_AUTOSTOP_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-Wold-style-cast -Wuseless-cast -Wduplicated-cond -Wlogical-op -Wnull-dereference"

      - name: Build (-Werror)
        run: |
          cmake --build build --parallel
          ls -l build/obs-auto-stop.so
          nm -D --defined-only build/obs-auto-stop.so | grep -q ' T obs_module_load$'

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.plugin_ref || '' }}
          path: plugin

      - name: Restore OBS SDK cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            obs-deps
            obs-dev
          key: obs-sdk-win64-${{ env.OBS_REF }}-${{ env.DEPS_DATE }}-v1

      # Headers only are needed on a cache hit (no submodules, shallow).
      - name: Checkout obs-studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_REF }}
          submodules: ${{ steps.sdk-cache.outputs.cache-hit != 'true' && 'recursive' || 'false' }}
          path: obs-studio

      - name: Download obs-deps + Qt6
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $date = $env:DEPS_DATE
          $base = "https://github.com/obsproject/obs-deps/releases/download/$date"
          New-Item -ItemType Directory -Force -Path obs-deps | Out-Null
          Invoke-WebRequest "$base/windows-deps-$date-x64.zip" -OutFile deps.zip
          Invoke-WebRequest "$base/windows-deps-qt6-$date-x64.zip" -OutFile qt6.zip
          Expand-Archive deps.zip -DestinationPath obs-deps -Force
          Expand-Archive qt6.zip -DestinationPath obs-deps -Force
          Remove-Item deps.zip, qt6.zip
          Get-ChildItem obs-deps | Select-Object Name

      - name: Configure obs-studio (libobs + frontend-api)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S obs-studio -B obs-build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/obs-deps" `
            -DENABLE_UI=ON `
            -DENABLE_FRONTEND=ON `
            -DENABLE_PLUGINS=OFF `
            -DENABLE_BROWSER=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_WEBSOCKET=OFF `
            -DENABLE_AJA=OFF `
            -DENABLE_VLC=OFF `
            -DENABLE_QSV11=OFF `
            -DENABLE_WEBRTC=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build obs-frontend-api
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake --build obs-build --target obs-frontend-api --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage OBS SDK (import libs + generated headers)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path obs-dev/lib, obs-dev/include | Out-Null
          foreach ($name in 'obs.lib', 'obs-frontend-api.lib') {
            $lib = Get-ChildItem -Recurse obs-build -Filter $name | Select-Object -First 1
            if (-not $lib) { throw "$name not found" }
            Copy-Item $lib.FullName "obs-dev/lib/$name" -Force
          }
          $found = $false
          foreach ($name in 'obsconfig.h', 'obs-config.h') {
            $h = Get-ChildItem -Recurse obs-build -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($h) { Copy-Item $h.FullName "obs-dev/include/$name" -Force; $found = $true }
          }
          if (-not $found) { throw 'obsconfig.h / obs-config.h not found in obs-build' }
          Get-ChildItem -Recurse obs-dev | Select-Object FullName, Length

      - name: Configure plugin
        shell: pwsh
        run: |
          $qtRoot = $null
          foreach ($r in (Get-ChildItem obs-deps -Directory)) {
            if (Test-Path (Join-Path $r.FullName 'lib/cmake/Qt6')) {
              $qtRoot = ($r.FullName -replace '\\', '/')
              break
            }
          }
          if (-not $qtRoot -and (Test-Path obs-deps/lib/cmake/Qt6)) {
            $qtRoot = ((Resolve-Path obs-deps).Path -replace '\\', '/')
          }
          if (-not $qtRoot) { throw 'Qt6 cmake package not found' }
          $dev = ((Resolve-Path obs-dev).Path -replace '\\', '/')
          $studio = ((Resolve-Path obs-studio).Path -replace '\\', '/')

          # All OBS paths are CMake cache variables; no CMakeLists patching.
          # obs_module_load/unload are exported via MODULE_EXPORT in obs-module.h.
          cmake -S plugin -B plugin-build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DOBS_AUTOSTOP_USE_PACKAGES=OFF `
            -DOBS_SOURCE_DIR="$studio" `
            -DOBS_LIBOBS_INCLUDE_DIR="$studio/libobs" `
            -DOBS_GENERATED_INCLUDE_DIR="$dev/include" `
            -DOBS_FRONTEND_API_INCLUDE_DIR="$studio/frontend/api" `
            -DOBS_LIBOBS_LIBRARY="$dev/lib/obs.lib" `
            -DOBS_FRONTEND_API_LIBRARY="$dev/lib/obs-frontend-api.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build plugin
        shell: pwsh
        run: |
          cmake --build plugin-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Get-ChildItem -Recurse plugin-build -Filter 'obs-auto-stop.dll' | Select-Object -First 1
          if (-not $dll) { throw 'obs-auto-stop.dll not found' }
          Get-Item $dll.FullName | Format-List FullName, Length
          "DLL_PATH=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify DLL exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          $exports = & $dumpbin /nologo /exports $env:DLL_PATH | Out-String
          Write-Output $exports
          foreach ($sym in 'obs_module_load', 'obs_module_unload', 'obs_module_set_pointer', 'obs_module_ver') {
            if ($exports -notmatch "\b$sym\b") { throw "missing export: $sym" }
          }

      - name: Package zip
        shell: pwsh
        run: |
          $cm = Get-Content plugin/CMakeLists.txt -Raw
          if ($cm -notmatch 'project\(obs-auto-stop VERSION ([0-9.]+)') { throw 'version not found' }
          $version = $Matches[1]
          $stage = Join-Path $pwd 'stage/obs-auto-stop'
          New-Item -ItemType Directory -Force -Path "$stage/bin/64bit", "$stage/data/locale" | Out-Null
          Copy-Item $env:DLL_PATH "$stage/bin/64bit/obs-auto-stop.dll" -Force
          Copy-Item plugin/data/locale/* "$stage/data/locale/" -Force
          $sha = (git -C plugin rev-parse --short HEAD).Trim()
          @(
            "OBS Auto Stop v$version - Windows x64 build",
            "Plugin commit: $sha",
            "Built against OBS: $env:OBS_REF (for OBS 32.x)",
            '',
            'Install:',
            '1. Close OBS.',
            '2. Extract so that the obs-auto-stop folder is at',
            '   %ProgramData%\obs-studio\plugins\obs-auto-stop\',
            '   (i.e. C:\ProgramData\obs-studio\plugins\obs-auto-stop\bin\64bit\obs-auto-stop.dll)',
            '3. Start OBS and open Docks > OBS Auto Stop.'
          ) | Set-Content -Encoding utf8 "$stage/README-DIST.txt"
          $zipName = "obs-auto-stop-v$version-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zipName -Force
          Get-Item $zipName | Format-List FullName, Length
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-auto-stop-windows
          path: ${{ env.ZIP_NAME }}

  release:
    name: Attach to GitHub Release
    needs: [linux, windows]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_release != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: obs-auto-stop-windows
      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.inputs.attach_release }}' obs-auto-stop-v*-windows-x64.zip --repo '${{ github.repository }}' --clobber
